name: StayAway CD Pipeline (Continuous Deployment to VPS via Docker)

on:
  push:
    branches:
      - main # CHỈ TỰ ĐỘNG DEPLOY KHI PUSH/MERGE VÀO NHÁNH MAIN
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công khi cần

jobs:
  # ==========================================
  # BƯỚC 1: KIỂM TRA CHẤT LƯỢNG TEST & BUILD (CI GATE)
  # ==========================================
  ci-gate:
    name: 🛡️ CI Gate (Verify Tests & Build on Main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        working-directory: ./Backend
        run: chmod +x mvnw || true

      - name: Run Backend Tests
        working-directory: ./Backend
        run: ./mvnw test --batch-mode

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Tests (Vitest)
        working-directory: ./Frontend
        run: npm test

      - name: Build Frontend Production Bundle
        working-directory: ./Frontend
        run: npm run build

  # ==========================================
  # BƯỚC 2: TỰ ĐỘNG DEPLOY LÊN VPS BẰNG DOCKER
  # ==========================================
  deploy-docker-to-vps:
    name: 🐳 Deploy Docker Containers to VPS (roomi.website)
    needs: ci-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VITE_API_BASE_URL_PROD
          script: |
            echo "=========================================================="
            echo "🚀 [StayAway CD] Bắt đầu tự động Deploy bằng Docker..."
            echo "=========================================================="

            # 1. Tìm hoặc clone thư mục dự án trên VPS
            PROJECT_DIR=""
            for dir in /var/www/stayaway /var/www/StayAway ~/stayaway ~/StayAway /home/${{ secrets.SERVER_USER }}/stayaway /home/${{ secrets.SERVER_USER }}/StayAway; do
              if [ -d "$dir" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            done

            if [ -z "$PROJECT_DIR" ]; then
              echo "📁 Chưa có thư mục dự án trên VPS, tiến hành clone mới..."
              mkdir -p ~/roomi
              PROJECT_DIR=~/roomi
              git clone https://github.com/dargits/roomi.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"
            echo "📂 Đang thực thi tại: $(pwd)"

            # 2. Đảm bảo remote trỏ đúng về repo dargits/roomi và cập nhật main
            git remote set-url origin https://github.com/dargits/roomi.git || true
            git fetch origin main
            git reset --hard origin/main

            # 3. Tạo file .env chứa các cấu hình Production
            export VITE_API_BASE_URL_PROD="${{ secrets.VITE_API_BASE_URL_PROD }}"
            echo "VITE_API_BASE_URL_PROD=${VITE_API_BASE_URL_PROD}" > .env

            # 4. Build & Chạy lại các container với Docker Compose
            echo "🐳 Đang build và khởi động lại Docker Containers..."
            docker compose down --remove-orphans || docker-compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans || docker-compose up -d --build --remove-orphans

            # 5. Dọn dẹp các Docker image cũ không còn sử dụng
            echo "🧹 Dọn dẹp các image dangling cũ..."
            docker image prune -f

            echo "=========================================================="
            echo "✅ [StayAway CD] Deploy thành công lên VPS roomi.website!"
            echo "=========================================================="
