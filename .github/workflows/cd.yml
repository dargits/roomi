name: CD — Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Lý do deploy thủ công'
        required: false
        default: 'Manual trigger'

concurrency:
  group: cd-production
  cancel-in-progress: false   # Không hủy deploy đang chạy, tránh trạng thái nửa chừng

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Test Backend (song song với Frontend)
  # ─────────────────────────────────────────────────────────────────
  test-backend:
    name: ☕ Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: ./Backend
        run: chmod +x mvnw && ./mvnw test --batch-mode -q

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Test & Build Frontend (song song với Backend)
  # ─────────────────────────────────────────────────────────────────
  test-frontend:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci --legacy-peer-deps

      - name: Run tests
        working-directory: ./Frontend
        run: npm test

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Docker Images lên GitHub Container Registry (GHCR)
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Images (GHCR)
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ☕ Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: |
            ghcr.io/dargits/roomi-backend:latest
            ghcr.io/dargits/roomi-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ⚛️ Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=https://roomi.website/api/v1
          tags: |
            ghcr.io/dargits/roomi-frontend:latest
            ghcr.io/dargits/roomi-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # JOB 4: Deploy lên VPS (Chỉ kéo Image có sẵn về chạy — Dưới 45s)
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to VPS (roomi.website)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            echo "▶ Starting fast deploy — $(date '+%Y-%m-%d %H:%M:%S')"

            # ── 1. Locate project directory ──────────────────────────
            PROJECT_DIR="$HOME/stayaway"
            if [ ! -d "$PROJECT_DIR" ]; then
              [ -d "/var/www/stayaway" ] && PROJECT_DIR="/var/www/stayaway" || \
                git clone https://github.com/dargits/roomi.git "$PROJECT_DIR"
            fi
            cd "$PROJECT_DIR"

            # ── 2. Pull latest code from main ────────────────────────
            git remote set-url origin https://github.com/dargits/roomi.git 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Code synced: $(git log -1 --oneline)"

            # ── 3. Write .env from existing roomi-db container ───────
            DB_PASS=$(docker inspect roomi-db \
              -f '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
              | grep MYSQL_ROOT_PASSWORD | cut -d= -f2 || echo "")
            DB_NET=$(docker inspect roomi-db \
              -f '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' 2>/dev/null \
              | head -n1 || echo "")

            cat > .env <<EOF
            DB_URL=jdbc:mysql://roomi-db:3306/stay?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
            DB_USER=root
            DB_PASS=${DB_PASS}
            VITE_API_BASE_URL_PROD=https://roomi.website/api/v1
            EOF

            # ── 4. Log in to GHCR & Pull pre-built images ────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true
            echo "⬇ Pulling pre-built images from GHCR..."
            docker compose pull || docker-compose pull
            echo "✓ Images pulled successfully"

            # ── 5. Recreate & restart containers ─────────────────────
            docker compose up -d --remove-orphans || \
              docker-compose up -d --remove-orphans
            echo "✓ Containers started"

            # ── 6. Attach backend to DB network (if needed) ──────────
            if [ -n "$DB_NET" ]; then
              docker network connect "$DB_NET" stayaway_backend 2>/dev/null || true
              docker restart stayaway_backend 2>/dev/null || true
              echo "✓ Backend connected to DB network: $DB_NET"
            fi

            # ── 7. Health check — wait up to 60s for backend ─────────
            echo "⏳ Waiting for backend to be healthy..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1 || \
                 curl -sf http://localhost:8080/api/v1/hotel-settings > /dev/null 2>&1; then
                echo "✓ Backend is healthy"
                break
              fi
              [ "$i" -eq 12 ] && echo "⚠ Backend health check timed out (may still be starting)" || \
                (echo "  Attempt $i/12 — retrying in 5s..." && sleep 5)
            done

            # ── 8. Prune unused images ────────────────────────────────
            docker image prune -f > /dev/null
            echo "✓ Old images pruned"

            echo "✅ Deploy complete — $(date '+%Y-%m-%d %H:%M:%S')"
