name: CI — Test & Build

on:
  push:
    branches-ignore:
      - main        # CD pipeline sẽ tự chạy CI gate riêng trên main
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true  # Hủy run cũ nếu có commit mới hơn đẩy lên

jobs:
  backend:
    name: ☕ Backend — Spring Boot + JUnit 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: ./Backend
        run: chmod +x mvnw && ./mvnw test --batch-mode -q

  frontend:
    name: ⚛️ Frontend — Vitest + Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./Frontend
        run: npm ci --legacy-peer-deps

      - name: Run tests
        working-directory: ./Frontend
        run: npm test

      - name: Build production bundle
        working-directory: ./Frontend
        run: npm run build
