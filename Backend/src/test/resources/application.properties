spring.application.name=stay-test

# Cấu hình In-Memory H2 Database cho Unit & Integration Tests trong CI/CD
spring.datasource.url=jdbc:h2:mem:stay_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

token.ttl=360000000000
app.domain=http://localhost:8080

cloudinary.cloud-name=test-cloud
cloudinary.api-key=123456789
cloudinary.api-secret=test-secret
