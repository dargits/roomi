spring.application.name=dev

server.port=8080

# Cấu hình MySQL Local (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/shydev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Cau hinh Hibernate / JPA cho PostgreSQL
# Cấu hình Hibernate / JPA cho MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# TTL cho token login
token.ttl=360000000000