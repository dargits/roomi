# =============================================================================
# Nginx Config cho HOST VPS — roomi.website
# =============================================================================
# File này dành cho Nginx chạy trực tiếp trên Ubuntu VPS (KHÔNG phải container)
# Certbot đã cài SSL. File này proxy traffic từ domain vào Docker container.
#
# Cách dùng:
#   sudo cp nginx-vps.conf /etc/nginx/sites-available/roomi
#   sudo ln -sf /etc/nginx/sites-available/roomi /etc/nginx/sites-enabled/roomi
#   sudo rm -f /etc/nginx/sites-enabled/default   (xóa config cũ nếu có)
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name roomi.website www.roomi.website;

    # Certbot challenge (Let's Encrypt auto-renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server — Main config
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name roomi.website www.roomi.website;

    # ── SSL Certificates (do Certbot tự tạo) ────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/roomi.website/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roomi.website/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ── Proxy tất cả traffic vào Frontend Docker container (port 3000) ───────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/roomi.access.log;
    error_log  /var/log/nginx/roomi.error.log warn;
}
