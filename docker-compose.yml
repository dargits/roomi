# ==============================================================================
#  STAYAWAY (PMS) — DOCKER COMPOSE MULTI-SERVICE ORCHESTRATION
# ==============================================================================
#  • Production URL  : https://stayaway.io.vn
#  • Backend Image   : ghcr.io/dargits/roomi-backend:latest
#  • Frontend Image  : ghcr.io/dargits/roomi-frontend:latest
#  • Orchestration   : Managed automatically by .github/workflows/deploy.yml
# ==============================================================================

services:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. BACKEND SERVICE (Spring Boot 3 + JDK 17 Alpine)
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/dargits/roomi-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stayaway_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      # Thông tin kết nối MySQL Database (Được nạp tự động qua file .env từ VPS)
      - SPRING_DATASOURCE_URL=${DB_URL:-jdbc:mysql://roomi-db:3306/stay?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS:-}
      # Cloudinary CDN lưu trữ ảnh tải lên
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-dnyemotdi}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-731499327571147}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-bSZWJxnQvsTeDygipIyYzKYeZ_M}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - stayaway_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ────────────────────────────────────────────────────────────────────────────
  # 2. FRONTEND SERVICE (React 18 + Vite + Nginx Alpine)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/dargits/roomi-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL_PROD:-/api/v1}
    container_name: stayaway_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - stayaway_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ──────────────────────────────────────────────────────────────────────────────
# NETWORKS CONFIGURATION
# ──────────────────────────────────────────────────────────────────────────────
networks:
  stayaway_network:
    name: stayaway_network
    driver: bridge
