version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: roomi-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laybo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roomi-network

  # Backend Spring Boot Service
  backend:
    build:
      context: ./Backend/roomi
      dockerfile: Dockerfile
    container_name: roomi-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/laybo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy
    networks:
      - roomi-network

  # Frontend React + Nginx Service
  frontend:
    build:
      context: ./Frontend/roomi
      dockerfile: Dockerfile
    container_name: roomi-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - roomi-network

volumes:
  mysql_data:

networks:
  roomi-network:
    driver: bridge
