spring.application.name=stay

server.port=8080

# ==============================================================================
# CƠ SỞ DỮ LIỆU (DATABASE)
# Cấu hình qua biến môi trường trong file .env
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stay?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate / JPA cho MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# TỐI ƯU HIỆU NĂNG BACKEND (PERFORMANCE OPTIMIZATION)
# ==============================================================================
# 1. Khử hoàn toàn N+1 query bằng batch fetch khi lazy load collection và quan hệ
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 2. Tối ưu batch insert và update
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 3. Tối ưu HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# TTL cho token login
token.ttl=360000000000

# ==============================================================================
# DOMAIN / URL ỨNG DỤNG
# ==============================================================================
app.domain=${APP_DOMAIN:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:${APP_DOMAIN:http://localhost:8080}}

# ==============================================================================
# CLOUDINARY (LƯU TRỮ ẢNH)
# Cấu hình qua biến môi trường trong file .env
# ==============================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ==============================================================================
# RESEND EMAIL SERVICE
# ==============================================================================
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:StayAway PMS <noreply@stayaway.io.vn>}

# ==============================================================================
# GOOGLE GEMINI AI
# ==============================================================================
gemini.api-key=${GEMINI_API_KEY:}

# Cấu hình giới hạn kích thước tải lên (CSV, hình ảnh, sao lưu)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==============================================================================
# TELEGRAM BOT (SAO LƯU CƠ SỞ DỮ LIỆU)
# Cấu hình qua biến môi trường trong file .env
# ==============================================================================
telegram.bot.token=${TELEGRAM_BOT_TOKEN:8227232435:AAHJJz3XQzLAdrac-ZYyMw0cJbSAWPM4p8Y}
telegram.bot.chat-id=${TELEGRAM_CHAT_ID:6865922651}
telegram.bot.enabled=${TELEGRAM_BACKUP_ENABLED:true}

# ==============================================================================
# CẤU HÌNH TỰ ĐỘNG KHỞI TẠO DỮ LIỆU (DATA SEEDER)
# ==============================================================================
# Các phần cần thiết (Tài khoản admin/lễ tân, Cấu hình khách sạn, Loại phòng, Sơ đồ phòng, Dịch vụ) luôn được kiểm tra an toàn.
# Đã nạp thành công bộ dữ liệu mẫu toàn diện từ tháng 1 đến nay. Để false khi khởi động bình thường (có thể nhấn nút Tái Tạo Dữ Liệu Mẫu trên giao diện bất cứ lúc nào):
app.seed.operational-data.enabled=false
