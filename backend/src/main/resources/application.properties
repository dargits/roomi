spring.application.name=stay


server.port=8080

# Cấu hình MySQL Local (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/stay?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate / JPA cho MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================================================================
# TỐI ƯU HIỆU NĂNG BACKEND (PERFORMANCE OPTIMIZATION)
# ==============================================================================
# 1. Khử hoàn toàn N+1 query bằng batch fetch khi lazy load collection và quan hệ
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 2. Tối ưu batch insert và update
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 3. Tối ưu HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000
# TTL cho token login
token.ttl=360000000000

# Cấu hình domain
app.domain=http://localhost:8080

# Cloudinary
cloudinary.cloud-name=dnyemotdi
cloudinary.api-key=731499327571147
cloudinary.api-secret=bSZWJxnQvsTeDygipIyYzKYeZ_M

# Cấu hình Resend Email Service
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:StayAway PMS <noreply@stayaway.io.vn>}

# Cấu hình giới hạn kích thước tải lên (CSV, hình ảnh, sao lưu)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ==============================================================================
# CẤU HÌNH TỰ ĐỘNG KHỞI TẠO DỮ LIỆU MẪU (DATA SEEDER)
# ==============================================================================
# Đặt false để tắt hoàn toàn việc tự động thêm dữ liệu mẫu khi khởi động lại backend
app.seed.enabled=false