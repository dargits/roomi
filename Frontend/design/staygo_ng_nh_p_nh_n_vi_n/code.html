<style>
        body { font-family: 'Arimo', sans-serif; }
    </style>

<body class="bg-surface text-on-surface h-screen overflow-hidden flex flex-col md:flex-row">
<!-- Left Side: Image (50%) -->
<div class="hidden md:flex md:w-1/2 relative bg-surface-container-high h-full">
<div class="absolute inset-0 bg-cover bg-center w-full h-full" data-alt="A luxurious hotel room interior during twilight, featuring a plush king-sized bed with crisp white linens, warm glowing bedside lamps, and a panoramic window overlooking a vibrant modern cityscape. The scene exudes a premium, corporate elegance consistent with high-end hospitality standards, using a sophisticated palette of deep twilight blues and soft warm gold lighting." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDAGYGh5uSprtLZ0Ajn5eQ1MUjb5Bu_6qCP-B4gML3wMngrGNe2n7GTKkdAPKZrGFAmCHJdzb11z-zz-xfLMdSJ5PyjbDRnIIRrZ5S0frR4TCZC1fBgR7czsFRpndcEEOdKagyWx7UOpmprA3mH7SceN64aoJLHWZv3NZP6-1ncGvfOeHB5PA62Yp_1ifx34PnKPFXe_-xr_1xcfcCjGequX0Hlnw045H36w1BHc-i3afi9FwcoW0IfsA')">
<div class="absolute inset-0 bg-gradient-to-t from-on-surface to-transparent opacity-80"></div>
</div>
<div class="relative z-10 flex flex-col justify-end p-12 h-full w-full">
<h1 class="font-display-lg text-display-lg text-on-primary max-w-lg mb-4">Trải nghiệm dịch vụ đẳng cấp cùng StayGO</h1>
<p class="font-body-lg text-body-lg text-on-primary opacity-80">Hệ thống quản lý vận hành chuyên nghiệp.</p>
</div>
</div>
<!-- Right Side: Login Form (50%) -->
<div class="w-full md:w-1/2 flex items-center justify-center p-8 lg:p-16 h-full bg-surface-container-lowest overflow-y-auto">
<div class="w-full max-w-md flex flex-col items-center">
<!-- Logo -->
<img alt="StayGO Logo" class="h-24 mb-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpy8agw3EK7Oi-zMRyva8W7vx2GlaazzsJoVekXTEYiRhPW_78jOhEdIT7Kjopeh388LsDhr0k-hR0WbUuAGHGrxeeCNmFLFR8Q-mrA3OLvRgyGJ2QI5MNQiSAFnJUYJKC5yzwaCPDHjy5JOVnO50we6l-F_9iNVcfBFQVBFq4Y_mHpG_D5p9WzA7KfBnjNaO4xAkaUUYXzrfDKaltjNsEwZT4_uaRtJrIFETz9jSgEgEhBPTWKsry5Q"/>
<h2 class="font-headline-md text-headline-md text-on-surface mb-8 text-center w-full">Đăng nhập hệ thống quản lý khách sạn StayGO</h2>
<!-- Form -->
<form class="w-full space-y-6">
<!-- Username -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">Tài khoản</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">person</span>
<input class="w-full pl-10 pr-4 py-3 border border-border-grey rounded-DEFAULT focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors" placeholder="Nhập tài khoản" type="text"/>
</div>
</div>
<!-- Password -->
<div class="relative">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1">Mật khẩu</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">lock</span>
<input class="w-full pl-10 pr-10 py-3 border border-border-grey rounded-DEFAULT focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface transition-colors" placeholder="Nhập mật khẩu" type="password"/>
<button class="absolute right-3 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 border-border-grey rounded-sm text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="ml-2 font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Ghi nhớ đăng nhập</label>
</div>
<!-- Login Button -->
<button class="w-full bg-agoda-blue hover:bg-primary-container text-on-primary font-title-lg text-title-lg py-3 rounded-DEFAULT shadow-sm hover:shadow-md transition-all" type="submit">ĐĂNG NHẬP</button>
</form>
<div class="w-full my-8 border-t border-border-grey relative">
<span class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-surface-container-lowest px-4 font-label-md text-label-md text-outline">Hoặc</span>
</div>
<!-- Quick Login Section -->
<div class="w-full bg-surface-container-low p-6 border border-border-grey rounded-DEFAULT">
<h3 class="font-title-lg text-title-lg text-on-surface mb-4 text-center">Hoặc đăng nhập nhanh</h3>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-border-grey text-on-surface font-body-md text-body-md py-3 pl-4 pr-10 rounded-DEFAULT focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary cursor-pointer">
<option disabled="" selected="">Chọn vai trò...</option>
<option>Quản trị viên</option>
<option>Lễ tân</option>
<option>Quản lý phòng</option>
<option>Kế toán</option>
<option>Nhân viên đặt phòng</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-outline">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Back to Booking -->
<button class="mt-8 w-full border border-agoda-blue text-agoda-blue hover:bg-surface-blue-light font-title-lg text-title-lg py-3 rounded-DEFAULT transition-colors">
                Không phải nhân viên? Quay lại cổng đặt phòng
            </button>
</div>
</div>
</body></html>
